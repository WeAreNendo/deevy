packages:
  - apps/*
  - packages/*
  - tools/*

allowBuilds:
  esbuild: true
  workerd: true

# Exact pins for the pre-release lines are deliberate (docs/PLAN.md "Risks worth naming",
# ADR-0007, ADR-0008, ADR-0009). Upgrade them on purpose, all packages of a line together.
# `shadcn add` rewrites this file and strips comments; put them back when it does.
catalog:
  # Tiptap 3.31.x, pinned exactly and moved as a whole like oRPC: the editor is one
  # package family and a mismatch between them is a runtime error, not a type one.
  "@tiptap/core": 3.31.3
  "@tiptap/extension-code-block-lowlight": 3.31.3
  "@tiptap/extension-list": 3.31.3
  "@tiptap/extension-placeholder": 3.31.3
  "@tiptap/extension-table": 3.31.3
  "@tiptap/markdown": 3.31.3
  "@tiptap/pm": 3.31.3
  "@tiptap/react": 3.31.3
  "@tiptap/starter-kit": 3.31.3
  "@tiptap/suggestion": 3.31.3
  # Live Documents (docs/plans/collaborative-documents.md, ADR-0021). Yjs and its
  # protocols are the CRDT; Hocuspocus is the room, and its server and provider
  # move together the way the Tiptap family does.
  yjs: 13.6.32
  y-protocols: 1.0.7
  "@hocuspocus/server": 4.7.0
  "@hocuspocus/provider": 4.7.0
  "@hocuspocus/common": 4.7.0
  "@tiptap/y-tiptap": 3.0.9
  # A three-way merge, for an Agent writing into a Document somebody is typing in.
  diff: ^9.0.0
  "@tiptap/extension-collaboration": 3.31.3
  "@tiptap/extension-collaboration-caret": 3.31.3
  # The websocket server Node has none of: the Worker gets its own from the
  # platform, so this is the one dependency only one runtime needs.
  ws: ^8.21.3
  "@types/ws": ^8.18.1
  lowlight: ^3.3.0
  rehype-highlight: ^7.0.2
  "@fontsource-variable/inter": 5.3.0
  "@fontsource-variable/jetbrains-mono": 5.3.0
  husky: ^9.1.7
  # Commit-message and release-notes tooling. Caret ranges, unlike the exact pins
  # below: those are pre-release lines whose breakage is a runtime error, and
  # these are a git hook and a changelog generator (docs/plans/commits-and-changelogs.md).
  "@commitlint/cli": ^21.2.2
  "@commitlint/config-conventional": ^21.2.2
  "@changesets/cli": ^3.0.2
  "@changesets/changelog-github": ^1.0.1
  "@types/node": ^26.1.1
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@0.3.0
  vite-plus: 0.3.0
  better-auth: 1.7.3
  "@better-auth/drizzle-adapter": 1.7.3
  "@better-auth/api-key": 1.7.3
  "@better-auth/mcp": 1.7.3
  "@better-auth/cimd": 1.7.3
  "@modelcontextprotocol/server": 2.0.0
  auth: 1.7.3
  drizzle-orm: 1.0.0-rc.4
  drizzle-kit: 1.0.0-rc.4
  # The CLI's argument parser (docs/plans/cli.md). A caret like the other stable
  # tooling: the exact pins above are pre-release lines whose breakage is a
  # runtime error, and this is a released major.
  commander: ^15.0.0
  # graphql-js, for `vp run sockets#check:linear`: deevy's Linear queries checked
  # against the schema Linear publishes, with no Linear account needed.
  graphql: 17.0.2
  "@orpc/server": 2.0.0-beta.32
  "@orpc/client": 2.0.0-beta.32
  "@orpc/contract": 2.0.0-beta.32
  "@orpc/openapi": 2.0.0-beta.32
  "@orpc/zod": 2.0.0-beta.32
  "@orpc/json-schema": 2.0.0-beta.32
  "@orpc/tanstack-query": 2.0.0-beta.32
  "@orpc/shared": 2.0.0-beta.32
  hono: 4.13.5
  "@hono/node-server": 2.1.1
  zod: 4.5.4
  react: 19.2.8
  react-dom: 19.2.8
  "@types/react": ^19.2.18
  "@types/react-dom": ^19.2.4
  "@vitejs/plugin-react": ^6.1.0
  "@tanstack/react-query": 5.102.8
  "@tanstack/react-router": 1.170.32
  tailwindcss: 4.3.3
  "@tailwindcss/vite": 4.3.3
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  tailwind-merge: ^3.6.0
  tw-animate-css: ^1.4.0
  # The CLI package, for the one stylesheet it ships: `shadcn/tailwind.css`, the custom
  # variants (data-horizontal, data-open, data-checked…) the base-mira components are written against.
  shadcn: ^4.21.0
  lucide-react: ^1.39.0
  "@base-ui/react": ^1.7.0
  react-markdown: ^10.1.0
  remark-gfm: ^4.0.1
  "@cloudflare/vite-plugin": 1.54.3
  "@cloudflare/workers-types": 5.20260903.1
  wrangler: 4.128.0
  sonner: ^2.0.8
  next-themes: ^0.4.6
  react-resizable-panels: ^4.12.3
  date-fns: ^4.4.0
  cmdk: ^1.1.1
  "@dnd-kit/core": ^6.3.1
  "@dnd-kit/utilities": ^3.2.2
  "@dnd-kit/sortable": ^10.0.0
  "@dnd-kit/modifiers": ^9.0.0

catalogMode: prefer

minimumReleaseAgeExclude:
  - "@cloudflare/workers-types@5.20260903.1"
  - "@better-auth/api-key@1.7.3"
  - "@better-auth/cimd@1.7.3"
  - "@better-auth/core@1.7.3"
  - "@better-auth/drizzle-adapter@1.7.3"
  - "@better-auth/kysely-adapter@1.7.3"
  - "@better-auth/mcp@1.7.3"
  - "@better-auth/memory-adapter@1.7.3"
  - "@better-auth/mongo-adapter@1.7.3"
  - "@better-auth/oauth-provider@1.7.3"
  - "@better-auth/prisma-adapter@1.7.3"
  - "@better-auth/telemetry@1.7.3"
  - auth@1.7.3
  - better-auth@1.7.3

overrides:
  vite@*: "catalog:"

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
