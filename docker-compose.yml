# A single deevy instance with its data on a named volume. Copy .env.example to
# .env and fill it in, or set these in your own environment.
services:
  deevy:
    image: ghcr.io/wearenendo/deevy:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - deevy-data:/data
    environment:
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set a secret of at least 32 characters}
      # What every tool's credentials are sealed under. A second value, not the
      # first one again, generated once (`openssl rand -base64 32`) and kept with
      # the volume: without it no tool can be connected, and a new one leaves
      # every connected tool's credentials unreadable.
      DEEVY_SECRET: ${DEEVY_SECRET:?set a second secret, not the same as BETTER_AUTH_SECRET}
      # Sign-in providers: set the pairs this instance offers, and leave the
      # rest empty. A pair with only one half is not registered and not offered,
      # and an instance with no pair at all says so on its sign-in page.
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITLAB_CLIENT_ID: ${GITLAB_CLIENT_ID:-}
      GITLAB_CLIENT_SECRET: ${GITLAB_CLIENT_SECRET:-}
      # A self-hosted GitLab, if it is not gitlab.com.
      GITLAB_ISSUER: ${GITLAB_ISSUER:-}
      # One generic OpenID Connect provider, discovered from its issuer. The
      # issuer counts as a half of the pair here: without it there is nothing
      # to discover, so the provider is not registered and not offered.
      DEEVY_OIDC_ISSUER: ${DEEVY_OIDC_ISSUER:-}
      DEEVY_OIDC_CLIENT_ID: ${DEEVY_OIDC_CLIENT_ID:-}
      DEEVY_OIDC_CLIENT_SECRET: ${DEEVY_OIDC_CLIENT_SECRET:-}
      # What the button says. "Single sign-on" unset.
      DEEVY_OIDC_NAME: ${DEEVY_OIDC_NAME:-}
      DEEVY_ADMIN_EMAIL: ${DEEVY_ADMIN_EMAIL:?set the email that becomes the Workspace admin}
      DEEVY_WORKSPACE_NAME: ${DEEVY_WORKSPACE_NAME:-deevy}
    # No healthcheck here: the image carries its own, and one named in compose
    # would override it. The one that used to be here called `node` by name,
    # which the image has no PATH entry and no shell to find — so it would have
    # reported unhealthy forever.

volumes:
  deevy-data:
