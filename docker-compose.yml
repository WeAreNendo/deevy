# A single deevy instance with its data on a named volume. Copy .env.example to
# .env and fill it in, or set these in your own environment.
services:
  deevy:
    image: ghcr.io/wearenendo/deevy:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - deevy-data:/data
    environment:
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set a secret of at least 32 characters}
      # What every tool's credentials are sealed under. A second value, not the
      # first one again, generated once (`openssl rand -base64 32`) and kept with
      # the volume: without it no tool can be connected, and a new one leaves
      # every connected tool's credentials unreadable.
      DEEVY_SECRET: ${DEEVY_SECRET:?set a second secret, not the same as BETTER_AUTH_SECRET}
      # Sign-in providers: set the pairs this instance offers, and leave the
      # rest empty. A pair with only one half is not registered and not offered,
      # and an instance with no pair at all says so on its sign-in page.
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITLAB_CLIENT_ID: ${GITLAB_CLIENT_ID:-}
      GITLAB_CLIENT_SECRET: ${GITLAB_CLIENT_SECRET:-}
      # A self-hosted GitLab, if it is not gitlab.com.
      GITLAB_ISSUER: ${GITLAB_ISSUER:-}
      # One generic OpenID Connect provider, discovered from its issuer. The
      # issuer counts as a half of the pair here: without it there is nothing
      # to discover, so the provider is not registered and not offered.
      DEEVY_OIDC_ISSUER: ${DEEVY_OIDC_ISSUER:-}
      DEEVY_OIDC_CLIENT_ID: ${DEEVY_OIDC_CLIENT_ID:-}
      DEEVY_OIDC_CLIENT_SECRET: ${DEEVY_OIDC_CLIENT_SECRET:-}
      # What the button says. "Single sign-on" unset.
      DEEVY_OIDC_NAME: ${DEEVY_OIDC_NAME:-}
      DEEVY_ADMIN_EMAIL: ${DEEVY_ADMIN_EMAIL:?set the email that becomes the Workspace admin}
      DEEVY_WORKSPACE_NAME: ${DEEVY_WORKSPACE_NAME:-deevy}
    # No healthcheck here: the image carries its own, and one named in compose
    # would override it. The one that used to be here called `node` by name,
    # which the image has no PATH entry and no shell to find — so it would have
    # reported unhealthy forever and held back the agent service below.

  # The reference agent runtime (docs/plans/m4.md). It is not part of deevy:
  # it holds one Agent's API key, which a Sponsor issues under Settings, Agents
  # after the instance is up, so this service is off until you ask for it:
  #
  #     docker compose --profile agent up -d
  #
  # Read docs/OPERATIONS.md before you start one: it holds a shell in a checkout
  # and reads text anyone with Project access wrote (ADR-0014).
  agent:
    profiles: ["agent"]
    # One image per harness, and the tag is the choice: `latest` is Claude Code;
    # `:opencode`, `:cursor` and `:copilot` carry the others, each wanting its
    # own credential below (docs/harnesses.md). Each image sets
    # DEEVY_AGENT_HARNESS to the CLI it carries, and the environment below does
    # not name it, because naming it in any form would replace or remove that.
    image: ${DEEVY_AGENT_IMAGE:-ghcr.io/wearenendo/deevy-agent:latest}
    restart: unless-stopped
    # The supervisor is root so it can run each session as another user, which
    # is what keeps the Agent's key and the git token out of a session's reach.
    # Four capabilities, each measured: SETUID and SETGID to become the session,
    # CHOWN to hand it its working directory, DAC_OVERRIDE to read and clean up
    # what it wrote (ADR-0019).
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID, CHOWN, DAC_OVERRIDE]
    depends_on:
      deevy:
        condition: service_healthy
    # Everything but DEEVY_URL is named without a value, and this is what
    # Compose was measured doing with one: set in your shell or in .env, the
    # value is passed; set nowhere, the variable is left out of the container,
    # and so is any value the image gave it in its own ENV. The image sets
    # none of these, so a setting you leave alone falls to the runtime's own
    # default (docs/OPERATIONS.md, "Its configuration"). That removal is why
    # DEEVY_AGENT_HARNESS, which the image does set, is not named here at all;
    # `${VAR:-}` would be no better, handing the container an empty value in
    # place of the image's. The variables DEEVY_AGENT_PASS_ENV names are not
    # here either, because this file cannot know them: add each one yourself.
    environment:
      DEEVY_URL: ${DEEVY_AGENT_URL:-http://deevy:3000}
      # Unset, the runtime refuses to start, which is the point: a `:?` here
      # was interpolated when the file was read, not when the profile was
      # selected, and refused `docker compose up` for the deevy service too —
      # on an instance that never asked for the Agent (docs/plans/sign-in.md).
      DEEVY_AGENT_KEY:
      # Every harness's credential. Only the image's harness hands its own to a
      # session (src/harness/*.ts). Claude Code, and OpenCode on Anthropic:
      ANTHROPIC_API_KEY:
      # Cursor CLI and GitHub Copilot CLI:
      CURSOR_API_KEY:
      COPILOT_GITHUB_TOKEN:
      # OpenCode, for whichever provider DEEVY_AGENT_MODEL names:
      ANTHROPIC_BASE_URL:
      OPENAI_API_KEY:
      OPENAI_BASE_URL:
      OPENROUTER_API_KEY:
      OPENCODE_API_KEY:
      GEMINI_API_KEY:
      GROQ_API_KEY:
      MISTRAL_API_KEY:
      XAI_API_KEY:
      DEEPSEEK_API_KEY:
      TOGETHER_API_KEY:
      FIREWORKS_API_KEY:
      AZURE_API_KEY:
      AZURE_RESOURCE_NAME:
      # Unset, the runtime picks the model in the image's harness's own naming
      # (`claude-opus-5`, or `anthropic/claude-opus-5` on OpenCode).
      DEEVY_AGENT_MODEL:
      DEEVY_AGENT_EFFORT:
      DEEVY_AGENT_MAX_TURNS:
      DEEVY_AGENT_RUN_TIMEOUT_SECONDS:
      DEEVY_AGENT_POLL_SECONDS:
      # With a repository the session also gets file and shell tools, in a
      # clone made fresh for each Run. Without one it has deevy's tools and an
      # empty directory (docs/plans/m4.md). The container is the boundary
      # either way, and the token below is the runtime's: the supervisor
      # clones and pushes, and the session never sees it.
      DEEVY_AGENT_REPO:
      DEEVY_AGENT_GIT_TOKEN:
      DEEVY_AGENT_BASE_BRANCH:
      # Set it here and on the Agent's webhook URL, and a Run starts when it is
      # assigned rather than at the next poll. Polling stays on either way.
      DEEVY_AGENT_WEBHOOK_SECRET:
      # The healthcheck below asks whichever port this says.
      DEEVY_AGENT_PORT:
      # A directory of its own for each Run's clone; mount a volume there if
      # the container's own disk is not where clones should go.
      DEEVY_AGENT_WORKDIR:
      DEEVY_AGENT_SESSION_UID:
      DEEVY_AGENT_SESSION_GID:
      DEEVY_AGENT_PASS_ENV:
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:'+(process.env.DEEVY_AGENT_PORT||8787)+'/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  deevy-data:
