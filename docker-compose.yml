# A single deevy instance with its data on a named volume. Copy .env.example to
# .env and fill it in, or set these in your own environment.
services:
  deevy:
    image: ghcr.io/WeAreNendo/deevy:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - deevy-data:/data
    environment:
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set a secret of at least 32 characters}
      # Sign-in providers: set the pairs this instance offers, and leave the
      # rest empty. A pair with only one half is not registered and not offered,
      # and an instance with no pair at all says so on its sign-in page.
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITLAB_CLIENT_ID: ${GITLAB_CLIENT_ID:-}
      GITLAB_CLIENT_SECRET: ${GITLAB_CLIENT_SECRET:-}
      # A self-hosted GitLab, if it is not gitlab.com.
      GITLAB_ISSUER: ${GITLAB_ISSUER:-}
      # One generic OpenID Connect provider, discovered from its issuer. The
      # issuer counts as a half of the pair here: without it there is nothing
      # to discover, so the provider is not registered and not offered.
      DEEVY_OIDC_ISSUER: ${DEEVY_OIDC_ISSUER:-}
      DEEVY_OIDC_CLIENT_ID: ${DEEVY_OIDC_CLIENT_ID:-}
      DEEVY_OIDC_CLIENT_SECRET: ${DEEVY_OIDC_CLIENT_SECRET:-}
      # What the button says. "Single sign-on" unset.
      DEEVY_OIDC_NAME: ${DEEVY_OIDC_NAME:-}
      DEEVY_ADMIN_EMAIL: ${DEEVY_ADMIN_EMAIL:?set the email that becomes the Workspace admin}
      DEEVY_WORKSPACE_NAME: ${DEEVY_WORKSPACE_NAME:-deevy}
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  # The reference agent runtime (docs/plans/m4.md). It is not part of deevy:
  # it holds one Agent's API key, which a Sponsor issues under Settings, Agents
  # after the instance is up, so this service is off until you ask for it:
  #
  #     docker compose --profile agent up -d
  #
  # Read docs/OPERATIONS.md before you start one: it holds a shell in a checkout
  # and reads text anyone with Project access wrote (ADR-0014).
  agent:
    profiles: ["agent"]
    # One image per harness: `latest` is Claude Code; `:opencode`, `:cursor` and
    # `:copilot` carry the others, each wanting its own credential in place of
    # ANTHROPIC_API_KEY (docs/harnesses.md).
    image: ${DEEVY_AGENT_IMAGE:-ghcr.io/WeAreNendo/deevy-agent:latest}
    restart: unless-stopped
    # The supervisor is root so it can run each session as another user, which
    # is what keeps the Agent's key and the git token out of a session's reach.
    # Four capabilities, each measured: SETUID and SETGID to become the session,
    # CHOWN to hand it its working directory, DAC_OVERRIDE to read and clean up
    # what it wrote (ADR-0019).
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID, CHOWN, DAC_OVERRIDE]
    depends_on:
      deevy:
        condition: service_healthy
    environment:
      DEEVY_URL: ${DEEVY_AGENT_URL:-http://deevy:3000}
      # Interpolated when the file is read, not when the profile is selected, so
      # a `:?` here refused `docker compose up` for the deevy service too — on
      # an instance that never asked for the Agent (docs/plans/sign-in.md).
      DEEVY_AGENT_KEY: ${DEEVY_AGENT_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      DEEVY_AGENT_HARNESS: ${DEEVY_AGENT_HARNESS:-claude-code}
      DEEVY_AGENT_POLL_SECONDS: ${DEEVY_AGENT_POLL_SECONDS:-30}
      DEEVY_AGENT_MODEL: ${DEEVY_AGENT_MODEL:-claude-opus-5}
      # With a repository the session also gets file and shell tools, in a
      # clone made fresh for each Run. Without one it has deevy's tools and an
      # empty directory (docs/plans/m4.md). The container is the boundary
      # either way, and the token below is the runtime's: the supervisor
      # clones and pushes, and the session never sees it.
      DEEVY_AGENT_REPO: ${DEEVY_AGENT_REPO:-}
      DEEVY_AGENT_GIT_TOKEN: ${DEEVY_AGENT_GIT_TOKEN:-}
      DEEVY_AGENT_BASE_BRANCH: ${DEEVY_AGENT_BASE_BRANCH:-main}
      # Set it here and on the Agent's webhook URL, and a Run starts when it is
      # assigned rather than at the next poll. Polling stays on either way.
      DEEVY_AGENT_WEBHOOK_SECRET: ${DEEVY_AGENT_WEBHOOK_SECRET:-}
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:8787/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  deevy-data:
