name: Changesets

# On every push to main, one of two things is true.
#
#  - Changesets are waiting. `changesets/action` opens or updates the "Version
#    Packages" pull request: the version bumps, the folded root CHANGELOG.md,
#    and the changeset files consumed.
#  - None are. Either that pull request just merged — in which case the version
#    in package.json has moved and this tags it, writes the GitHub Release, and
#    calls the publish workflow — or this is an ordinary commit and the tag
#    already exists, which is what `guard` checks and why an ordinary push to
#    main does not release anything.
on:
  push:
    branches: [main]

# Never cancelled: a half-done release is worse than a queued one.
concurrency:
  group: changesets
  cancel-in-progress: false

jobs:
  version:
    name: The Version PR, or the tag when it merges
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release: ${{ steps.guard.outputs.release }}
      version: ${{ steps.guard.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@v1.19.0
        with:
          node-version-file: .node-version
          cache: true
          run-install: false

      - name: Install
        run: vp install --frozen-lockfile

      # Whether changesets are waiting is read from the commit, before the
      # action runs, and never from its outputs. Two reasons, and the second one
      # cost a release:
      #
      #  - the action rewrites the working tree in place when there ARE
      #    changesets, so anything read afterwards describes its output and not
      #    this commit;
      #  - in the branch it takes when there are none and no publish script is
      #    configured — deevy's case, since nothing goes to npm — it returns
      #    without setting any output at all, so `hasChangesets` is the empty
      #    string rather than 'false'.
      - name: Are changesets waiting on this commit?
        id: pending
        run: |
          # -maxdepth 1 is load-bearing in pre-release mode and must stay.
          # `changeset version` does not delete a changeset while pre mode is on;
          # it moves it into .changeset/pre/ so that leaving pre mode can re-read
          # every change into the final version's notes. Counting those would
          # mean an rc never releases, because the queue would never look empty.
          count=$(find .changeset -maxdepth 1 -name '*.md' ! -name 'README.md' | wc -l | tr -d ' ')
          echo "$count changeset(s) waiting."
          echo "any=$([ "$count" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      # The title and commit are conventional on purpose: this pull request is
      # squash-merged like any other and its title becomes a commit on main,
      # where the check in pull-request.yml will read it.
      # Pinned exactly, and v2 rather than v1 on purpose: the action's majors
      # track the changesets majors, and v1 bundles changesets 2 while the CLI
      # in this workspace is 3. That mismatch is invisible until pre-release
      # mode, where the two disagree about the shape of .changeset/pre.json —
      # v1 goes looking for a file the CLI never wrote and the release dies on
      # an ENOENT. Move this pin and the catalog's @changesets/cli together.
      - name: Open or update the Version PR
        uses: changesets/action@v2.1.1
        with:
          version-script: vp run version
          pr-title: "chore(release): version packages"
          commit-message: "chore(release): version packages"
          # Not GITHUB_TOKEN. GitHub refuses to let that token start a workflow
          # run — the loop it is protecting against — so every check on the
          # Version PR queued as `action_required` and expired unapproved, and
          # approving is per run rather than a standing permission. A token that
          # belongs to somebody makes the PR theirs and its checks simply run
          # (changesets.dev/guide/automating). A fine-grained PAT on this
          # repository alone, Contents and Pull requests, read and write: it
          # expires, and the release quietly stops updating the Version PR when
          # it does, which is the price of not keeping a GitHub App.
          github-token: ${{ secrets.RELEASE_TOKEN }}
          # This workflow makes the tag and the Release itself, a few steps
          # down, so that they describe the folded changelog rather than the
          # per-package one. v2 would otherwise start creating git tags where
          # v1 did not.
          create-github-releases: false
          push-git-tags: false
        env:
          # Still needed — this is what @changesets/changelog-github reads
          # inside `vp run version` to turn each changeset into a line naming
          # its pull request — and it must be the *same* token as the input
          # above. v2.1.1 refuses the pair when they differ rather than leaving
          # you to guess which one it used, so leaving this as GITHUB_TOKEN
          # fails the run outright: "The GITHUB_TOKEN environment variable is
          # set and does not match the github-token input."
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}

      # Two conditions. Changesets waiting means the action has just opened or
      # updated the Version PR and there is nothing to release yet — releasing
      # here tags the Version PR's own commit, which is not on main, while its
      # pull request is still open. And no changesets is not the signal on its
      # own either, because it is true of every ordinary commit on main; the tag
      # is the rest of it, so a version whose tag does not exist yet is one the
      # Version PR just brought in.
      - name: Is there a version here that has not been released?
        id: guard
        if: steps.pending.outputs.any == 'false'
        run: |
          # From the commit rather than the working tree, so a future step order
          # cannot reintroduce the bug above.
          version=$(git show HEAD:package.json | node -p "JSON.parse(require('node:fs').readFileSync(0,'utf8')).version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "v$version is already tagged; nothing to release."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "v$version is new."
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Tag it
        if: steps.guard.outputs.release == 'true'
        env:
          VERSION: ${{ steps.guard.outputs.version }}
        run: |
          git tag "v$VERSION"
          git push origin "v$VERSION"

      - name: Write the GitHub Release from the changelog
        if: steps.guard.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.guard.outputs.version }}
        run: |
          node tools/release/scripts/release-notes.ts "$VERSION" > /tmp/release-notes.md
          # A version with a `-` in it is a release candidate: GitHub marks it as
          # a prerelease and keeps it off the repository's "latest release",
          # which is the same rule that keeps it off the `latest` image tag.
          case "$VERSION" in
            *-*) prerelease=--prerelease ;;
            *) prerelease= ;;
          esac
          gh release create "v$VERSION" --title "v$VERSION" --notes-file /tmp/release-notes.md $prerelease

  # The one package deevy publishes. Everything else in the workspace is part of
  # an instance; this is the part somebody installs, so it goes where somebody
  # would install it from.
  #
  # Its own job rather than `changesets/action`'s `publish` input, for the same
  # reason `create-github-releases` and `push-git-tags` are off above: this
  # workflow owns the tag and the Release so that they describe the folded
  # changelog, and handing half of the release back to the action would put two
  # things in charge of when a version is out.
  npm:
    name: The CLI on npm
    # After the images, which means after `release.yml` has re-run the whole of
    # CI. An image can be pushed again; an npm version cannot — seventy-two
    # hours and then the number is burned — so the thing that cannot be taken
    # back goes last rather than in parallel.
    needs: [version, publish]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # Provenance: npm records which workflow, which commit and which
      # repository built the tarball, and anybody can check it. It costs one
      # permission and is the only thing that makes "this came from deevy" more
      # than a claim in the README.
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v${{ needs.version.outputs.version }}

      - name: Install
        uses: voidzero-dev/setup-vp@v1.19.0
        with:
          node-version-file: .node-version
          cache: true
          run-install: true
          # This is what actually authenticates the publish. NODE_AUTH_TOKEN on
          # its own is inert: it is a convention that works only because
          # something writes an .npmrc containing `_authToken=${NODE_AUTH_TOKEN}`,
          # and nothing in this repository did. Without it the publish fails
          # ENEEDAUTH, having sent no credential at all.
          registry-url: https://registry.npmjs.org
          scope: "@deevy"

      # From the tag, so what is published is what was tagged rather than
      # whatever main has moved on to.
      - name: Build the bundle that ships
        run: vp run cli#build

      # pnpm rather than npm, because the package's devDependencies name
      # workspace packages with pnpm's `workspace:` protocol and npm does not
      # know what that is. pnpm rewrites them as it publishes; there are none in
      # `dependencies` to rewrite, because the bundle inlines everything. pnpm
      # also packs the workspace LICENSE, which npm cannot reach from here.
      #
      # Through `vp pm`, because there is no bare pnpm on a GitHub runner —
      # the image ships npm and yarn, and vp keeps its own pnpm where nothing
      # else on PATH can see it.
      - name: Publish
        working-directory: apps/cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          version="${{ needs.version.outputs.version }}"
          # Idempotent: re-running a release that already published must not
          # fail it. `npm view` on a missing version exits 1 with E404, so this
          # skips only what is genuinely there.
          if npm view "@deevy/cli@$version" version >/dev/null 2>&1; then
            echo "@deevy/cli@$version is already on npm; nothing to do."
            exit 0
          fi
          # --provenance explicitly: pnpm documents the flag, and whether it
          # reads NPM_CONFIG_PROVENANCE is not something to find out during a
          # release. --no-git-checks because this is a detached checkout of the
          # tag, which pnpm otherwise refuses to publish from.
          vp pm publish --access public --provenance --no-git-checks

  # Called rather than left to the tag push above, which GITHUB_TOKEN cannot
  # trigger. This re-runs the whole of CI before either image is pushed.
  publish:
    name: Images
    needs: version
    if: needs.version.outputs.release == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/release.yml
    with:
      version: ${{ needs.version.outputs.version }}
