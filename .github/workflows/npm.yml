name: npm

# The one package deevy publishes. Everything else in the workspace is part of
# an instance; this is the part somebody installs, so it goes where somebody
# would install it from.
#
# Two ways in, the same two release.yml has and for the same reason:
#
#  - `workflow_call`, from changesets.yml, once a Version PR has merged and the
#    images are out.
#  - `workflow_dispatch`, which defaults to a **rehearsal**: every step of a
#    real publish except the upload. Unticking that repairs a release whose npm
#    job alone failed — which v0.8.0 spent an hour in, its images having failed
#    and taken the publish with them.
#
# There is no `verify` job here, and release.yml has one. The difference is what
# each route can reach: this one publishes a version or refuses, and a version
# means a tag, and a tag only ever names a commit on main — which ci.yml has
# already run on, because it runs on every push there. release.yml can also be
# entered by a `v*` tag pushed by hand at any commit, which is the case its
# `verify` exists for and which this file has no equivalent of.
#
# The rehearsal exists because nothing else can tell you this job works: a
# release runs it once, at the end, on the one commit where a mistake costs a
# version number, so the alternative to rehearsing is finding out then. It has
# earned that twice already — once on npm refusing to run at this repository's
# root, and once on a credential check that could not fail.
#
# **There is no npm token.** npm mints a short-lived one per run from this
# workflow's OIDC identity, which is why `id-token: write` below is the whole
# credential and why the secret it replaced should be deleted rather than kept
# as a fallback: with a token present pnpm falls back to it silently, and a
# trusted publisher that has stopped working looks exactly like one that works.
#
# What a rehearsal proves and what it does not:
#
#  - it proves the runner has `vp pm`, that npm exchanges this workflow's
#    identity for a publish token, and that the tarball packs with the four
#    files it should.
#  - it cannot prove that the token npm hands back may publish rather than only
#    stage, which is a per-publisher setting and shows only at a real publish.
#    That fails loudly and does not burn the version: a publish that fails has
#    published nothing, so the fix is a re-run.

on:
  workflow_call:
    inputs:
      version:
        description: The version being released, without a leading v. Its tag must exist.
        required: true
        type: string
      dry-run:
        description: Rehearse rather than publish.
        required: false
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      version:
        description: A released version to publish, without a leading v. Empty rehearses this branch instead.
        required: false
        type: string
      dry-run:
        description: Rehearse rather than publish. Untick only to repair a release whose npm job failed.
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  npm:
    name: ${{ inputs.dry-run && 'Rehearse the publish' || 'Publish to npm' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # Provenance: npm records which workflow, which commit and which
      # repository built the tarball, and anybody can check it. It costs one
      # permission and is the only thing that makes "this came from deevy" more
      # than a claim in the README.
      id-token: write
    steps:
      # From the tag, so what is published is what was tagged rather than
      # whatever main has moved on to. A rehearsal is given no version and
      # takes the branch it was dispatched on, which is the point of rehearsing
      # a change to this file before it is the thing releasing.
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.version != '' && format('v{0}', inputs.version) || github.ref }}

      - name: Install
        uses: voidzero-dev/setup-vp@v1.19.0
        with:
          node-version-file: .node-version
          cache: true
          run-install: true
          # No `registry-url` and no `scope`, which is the point of this file
          # now. Those exist to write an .npmrc naming NODE_AUTH_TOKEN, and
          # there is no longer a token to name: npm mints a short-lived one per
          # run from the OIDC identity below. An .npmrc carrying an empty
          # `_authToken` would be worse than none, since it sends an empty
          # credential and is refused before the exchange is reached.

      - name: Build the bundle that ships
        run: vp run cli#build

      # The `bin` is this file and nothing makes it executable on the way in, so
      # a bundler that dropped the banner would ship a package that installs and
      # cannot run. Checked here rather than in a test because here is where a
      # build has just happened.
      - name: The bin starts with a shebang
        run: head -1 apps/cli/dist/main.mjs | grep -qx '#!/usr/bin/env node'

      # The rehearsal's one real check, and it replaces `vp pm whoami`, which
      # needed a token to ask about and now has none.
      #
      # It has to read the output rather than trust the exit code. pnpm treats
      # a failed token exchange as a **warning** and carries on — with a token
      # in the environment it would quietly fall back to it, and with none it
      # gets as far as packing before the registry refuses it. Either way a
      # misconfigured trusted publisher passes a dry run, which is the same
      # trap `publish --dry-run` set by authenticating nothing at all.
      - name: Rehearse, and insist the trusted publisher answered
        if: inputs.dry-run
        working-directory: apps/cli
        run: |
          # --provenance is left off: npm attaches it on its own for an OIDC
          # publish, and asking for it here fails on something a release would
          # not.
          set -o pipefail
          vp pm publish --access public --no-git-checks --dry-run 2>&1 | tee rehearsal.log
          if grep -q 'Skipped OIDC' rehearsal.log; then
            echo "::error::npm did not exchange the OIDC identity for a publish token."
            echo "Check the trusted publisher at npmjs.com: @deevy/cli -> Settings ->"
            echo "Trusted publishing. It wants org WeAreNendo, repository deevy,"
            echo "workflow npm.yml, and no environment."
            exit 1
          fi

      # pnpm rather than npm, because the package's devDependencies name
      # workspace packages with pnpm's `workspace:` protocol and npm does not
      # know what that is. pnpm rewrites them as it publishes; there are none in
      # `dependencies` to rewrite, because the bundle inlines everything. pnpm
      # also packs the workspace LICENSE, which npm cannot reach from here.
      #
      # Through `vp pm`, because there is no bare pnpm on a GitHub runner —
      # the image ships npm and yarn, and vp keeps its own pnpm where nothing
      # else on PATH can see it.
      - name: Publish
        if: ${{ !inputs.dry-run }}
        working-directory: apps/cli
        env:
          VERSION: ${{ inputs.version }}
        run: |
          # A dispatch leaves this empty unless it is given one, and every way
          # of continuing from there is wrong: `npm view "@deevy/cli@"` resolves
          # to *latest* rather than erroring, so this would either report
          # nothing to do and exit green having published nothing, or, before
          # the first release, fall through and publish whatever version
          # apps/cli/package.json happens to carry — from a branch, untagged.
          if [ -z "$VERSION" ]; then
            echo "::error::No version. A publish needs one, and its tag must exist."
            exit 1
          fi
          # Idempotent: re-running a release that already published must not
          # fail it. `npm view` on a missing version exits 1 with E404, so this
          # skips only what is genuinely there.
          if vp pm view "@deevy/cli@$VERSION" version >/dev/null 2>&1; then
            echo "@deevy/cli@$VERSION is already on npm; nothing to do."
            exit 0
          fi
          # No --provenance: npm generates and attaches it itself for an OIDC
          # publish, and passing the flag is how you find out whether pnpm
          # agrees. --no-git-checks because this is a detached checkout of the
          # tag, which pnpm otherwise refuses to publish from.
          vp pm publish --access public --no-git-checks
