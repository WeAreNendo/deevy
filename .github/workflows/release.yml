name: Release

# Publishes two images and nothing else: deevy, and the reference agent runtime
# beside it. The Cloudflare Worker built from the same commit is deployed by hand
# (docs/OPERATIONS.md), because uploading one needs an account credential this
# repository does not hold.
#
# Three ways in, and the first is the normal one:
#
#  - `workflow_call`, from changesets.yml, once a Version PR has merged. It has to
#    be a call rather than the tag below, because a tag pushed with GITHUB_TOKEN
#    does not trigger a workflow — wiring the merge to push a tag and expecting
#    this file to notice produces a release that silently never happens.
#  - a `v*` tag pushed by hand, the escape hatch for a release made outside the
#    changesets flow (docs/OPERATIONS.md).
#  - `workflow_dispatch` with a version, for the case this workflow has actually
#    hit: the tag and the GitHub Release exist and only the images are missing,
#    because a build failed. Re-tagging is not an option then, so republishing
#    has to be startable on its own.
#
# CI's own checks run on main and on pull requests; `verify` re-runs them so no
# route can publish something that does not build.
on:
  push:
    tags: ["v*"]
  workflow_call:
    inputs:
      version:
        description: The version being released, without a leading v.
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: The version to publish images for, without a leading v. Its tag must already exist.
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  # One job per image per architecture, each on a runner of its own architecture.
  #
  # This used to be one job building linux/amd64,linux/arm64 together, which meant
  # the arm64 half ran under QEMU — and the Dockerfile builds the whole workspace
  # inside the image (`vp install` then `vp run -r build`), so that is a full JS
  # toolchain install and an SPA build, emulated. It cost about three times what
  # the native half did and, on the 0.5.0-rc.0 release, hung outright partway
  # through the SPA build. Native arm64 runners are free for public repositories,
  # so the emulation is simply removed rather than tuned.
  #
  # Each job pushes an image with no tag, addressed only by digest; `manifest`
  # below collects the digests into one multi-architecture tag.
  build:
    name: ${{ matrix.image.key }} on ${{ matrix.arch.key }}
    needs: verify
    runs-on: ${{ matrix.arch.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        image:
          # `key` and not the image's name: it is also the artifact name below,
          # and a `digests-deevy-*` pattern would match `digests-deevy-agent-*`.
          - key: server
            suffix: ""
            dockerfile: apps/server/Dockerfile
            build_args: ""
          # The runtime is one image per harness (docs/harnesses.md), all from
          # one Dockerfile, told apart by the CLI the build argument installs.
          - key: agent-claude-code
            suffix: "-agent"
            dockerfile: apps/agent/Dockerfile
            build_args: HARNESS=claude-code
          - key: agent-opencode
            suffix: "-agent"
            dockerfile: apps/agent/Dockerfile
            build_args: HARNESS=opencode
          - key: agent-cursor
            suffix: "-agent"
            dockerfile: apps/agent/Dockerfile
            build_args: HARNESS=cursor
          - key: agent-copilot
            suffix: "-agent"
            dockerfile: apps/agent/Dockerfile
            build_args: HARNESS=copilot
        arch:
          - key: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - key: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      # GHCR rejects a mixed-case repository name outright. `github.repository`
      # carries the owner exactly as GitHub spells it, and that spelling is not
      # ours to rely on: it changed under this repository when the organisation
      # was renamed, and a release that had worked for months failed on
      # `ghcr.io/WeAreNendo/deevy` having already tagged the version and written
      # the GitHub Release. Actions expressions have no lowercase function; bash
      # does, so the name is computed once per job and used everywhere below.
      - name: The image name, which GHCR insists is lowercase
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: actions/checkout@v7

      # No setup-qemu-action: every build here is native, which is the point.
      - uses: docker/setup-buildx-action@v4

      - name: Sign in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        # The step timeout is the one that matters. The last emulated build of
        # both architectures together took 6m28s, so a native build of one is a
        # few minutes and ten is roughly triple the headroom it needs. The
        # release this replaced hung inside the SPA build and sat there until a
        # 30-minute job timeout would have killed it; this fails in ten and says
        # which architecture did it.
        timeout-minutes: 10
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          build-args: ${{ matrix.image.build_args }}
          platforms: ${{ matrix.arch.platform }}
          outputs: type=image,name=${{ env.IMAGE }}${{ matrix.image.suffix }},push-by-digest=true,name-canonical=true,push=true
          # Scoped per image and architecture: one shared scope would have the
          # four jobs overwriting each other's cache on every release.
          cache-from: type=gha,scope=${{ matrix.image.key }}-${{ matrix.arch.key }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.key }}-${{ matrix.arch.key }}

      - name: Hand the digest to the manifest job
        run: |
          mkdir -p /tmp/digests
          digest='${{ steps.build.outputs.digest }}'
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.image.key }}-${{ matrix.arch.key }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # The tags everybody pulls are created here, once both architectures exist, so
  # a tag never points at a half-published image.
  manifest:
    name: ${{ matrix.image.key }} manifest
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        # `primary` gets the bare version tags and `latest`; a harness image
        # gets `<version>-<harness>` and the moving `<harness>` tag. Claude Code
        # is both, so the compose profile keeps pulling what it did
        # (docs/harnesses.md).
        image:
          - key: server
            suffix: ""
            harness: ""
            primary: true
          - key: agent-claude-code
            suffix: "-agent"
            harness: claude-code
            primary: true
          - key: agent-opencode
            suffix: "-agent"
            harness: opencode
            primary: false
          - key: agent-cursor
            suffix: "-agent"
            harness: cursor
            primary: false
          - key: agent-copilot
            suffix: "-agent"
            harness: copilot
            primary: false
    steps:
      # Lowercased for the same reason as in the build job above.
      - name: The image name, which GHCR insists is lowercase
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.image.key }}-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - name: Sign in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}${{ matrix.image.suffix }}
          # The ref carries a version only on the tag-push route; on a call or a
          # dispatch it is a branch, so the caller passes the version instead.
          # Exactly one of these two pairs is enabled.
          tags: |
            type=semver,pattern={{version}},enable=${{ inputs.version == '' && matrix.image.primary }}
            type=semver,pattern=v{{version}},enable=${{ inputs.version == '' && matrix.image.primary }}
            type=raw,value=${{ inputs.version }},enable=${{ inputs.version != '' && matrix.image.primary }}
            type=raw,value=v${{ inputs.version }},enable=${{ inputs.version != '' && matrix.image.primary }}
            type=semver,pattern={{version}}-${{ matrix.image.harness }},enable=${{ inputs.version == '' && matrix.image.harness != '' }}
            type=raw,value=${{ inputs.version }}-${{ matrix.image.harness }},enable=${{ inputs.version != '' && matrix.image.harness != '' }}
            # A prerelease must never move `latest` or a harness's moving tag.
            # Both routes carry the version in a different place, and a `-` in
            # it is what marks one: v0.5.0-rc.1 publishes under its own tags.
            type=raw,value=${{ matrix.image.harness }},enable=${{ matrix.image.harness != '' && !contains(inputs.version || github.ref_name, '-') }}
            type=raw,value=latest,enable=${{ matrix.image.primary && !contains(inputs.version || github.ref_name, '-') }}

      - name: Point the tags at both architectures
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$IMAGE${{ matrix.image.suffix }}@sha256:%s " *)

      - name: Say what it points at
        run: |
          docker buildx imagetools inspect \
            "$IMAGE${{ matrix.image.suffix }}:$(jq -cr '.tags[0]|split(":")[-1]' <<< "$DOCKER_METADATA_OUTPUT_JSON")"
