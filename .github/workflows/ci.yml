name: CI

# Not for a change that is only prose. Markdown builds nothing and no suite
# reads it, so a pull request (or a push to main) that touches nothing else runs
# none of the jobs below: about a dozen runner-minutes saved each time. The
# exceptions are the Markdown something does read: docs/OPERATIONS.md and
# docs/m3-acceptance.md, which tests in apps/server and tools/release check
# against the code, and Markdown under a package's src/, which a build may
# ship. prose.yml checks a Markdown
# change instead, formatting and the docs site's build and tests, in one job.
# Order matters in `paths`: a later pattern wins, so the exceptions come after
# the exclusions; the list is written once and named.
#
# A workflow that `paths` skips leaves its checks pending rather than passed, so
# none of these may become a required check on main without a gate job that
# always runs: a Markdown-only pull request would never merge.
on:
  push:
    branches: [main]
    paths: &code
      - "**"
      - "!**/*.md"
      - "!**/*.mdx"
      - "!apps/docs/content/**"
      - docs/OPERATIONS.md
      - docs/m3-acceptance.md
      - "apps/*/src/**/*.md"
      - "packages/*/src/**/*.md"
  pull_request:
    paths: *code
  # Called by release.yml, so a tag cannot publish something that does not build.
  # A call always runs, whatever changed.
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Five jobs that need nothing from each other, because wall-clock time is what
# anybody waits for. Run as one job these took six minutes, most of it one
# machine running six test suites against each other for its four cores; split,
# the slowest arm is the tests and everything else finishes under it. Each arm
# pays its own install, which is the trade: more runner minutes, half the wait.
jobs:
  check:
    name: Format, lint, typecheck, and the snapshots
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@v1.19.0
        with:
          node-version-file: .node-version
          cache: true
          run-install: false

      - name: Install
        run: vp install --frozen-lockfile

      - name: Format, lint, typecheck
        run: vp check

      # Everything but the docs site, which has a step of its own below.
      - name: Build (Node server and SPA)
        run: vp run -F '!@deevy/docs' build

      - name: Build (Cloudflare Worker)
        run: vp run web#build:workers

      - name: Validate the Worker bundle
        run: vp run web#check:workers

      # The many-Workspaces Worker (ADR-0028), bundled and validated by wrangler
      # against the SPA the step above built.
      - name: Build and validate the hosted Worker
        run: vp run hosted#build:hosted

      # What every release attaches (hosted-release.yml): the bundle, the SPA, a
      # wrangler.json with the deployer's blanks marked, and a manifest. Then
      # the archive taken apart with the system's tar, every file checked
      # against the manifest, and its own wrangler.json dry-run by wrangler from
      # that copy, so a release cannot carry a Worker wrangler would refuse.
      - name: Package the hosted Worker, and dry-run it as shipped
        run: |
          vp run hosted#package
          vp run hosted#check:hosted

      - name: Migration SQL guard
        run: vp run db#check:migrations

      - name: OpenAPI snapshot is current
        run: |
          vp run core#snapshot:openapi
          git diff --exit-code -- packages/core/openapi.json

      # The tool set an agent sees, diffed like the HTTP surface (ADR-0009).
      - name: MCP tool list is current
        run: |
          vp run core#snapshot:mcp-tools
          git diff --exit-code -- packages/core/mcp-tools.json

      # docs.deevy.dev, built from apps/docs/content and the snapshot above: a
      # link to a file, a page or a heading that does not exist fails the build,
      # so a pull request that breaks one is red here (apps/docs). Deployed from
      # main by docs.yml, never from here.
      - name: The docs site builds, and every link in it lands
        run: vp run docs#build

      - name: Validate the docs Worker
        run: vp run docs#check:workers

  # Sharded, because six suites on one four-core runner spent most of their time
  # waiting for each other. The groups are balanced on measured time — apps/web
  # is 73s on its own and sets the floor, so splitting further buys nothing.
  test:
    name: Tests (${{ matrix.shard.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard:
          - name: web
            filters: -F web
          - name: core
            filters: -F core -F db -F adapters -F sockets -F email -F design -F release -F cli -F docs
          # `acceptance` has no unit suite: its test is the walk, which needs
          # every deployment built and runs in the `runtime` job below. It is
          # named here so the workspace-membership test sees every package.
          - name: server and hosted
            filters: -F server -F hosted -F acceptance
    steps:
      - uses: actions/checkout@v7

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@v1.19.0
        with:
          node-version-file: .node-version
          cache: true
          run-install: false

      - name: Install
        run: vp install --frozen-lockfile

      # Restored after the install, which can touch the directory. `test` is a
      # task in each package's vite.config rather than a package.json script,
      # which is what makes it cacheable at all; the fingerprint is the files
      # each suite reads, so a shard whose packages nobody touched skips
      # entirely and one that reads a changed packages/core does not.
      # https://viteplus.dev/guide/github-actions-cache
      - name: Restore the task cache
        uses: actions/cache/restore@v6
        with:
          path: node_modules/.vite/task-cache
          # Unique per run so every run saves, and per shard so three jobs
          # writing at once do not overwrite each other's.
          key: vite-task-${{ runner.os }}-${{ runner.arch }}-${{ matrix.shard.name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            vite-task-${{ runner.os }}-${{ runner.arch }}-${{ matrix.shard.name }}-

      # A pull request replays a suite whose inputs — every file it read, less
      # vitest's own results directory (each package's vite.config) — match a
      # cached run; a push to main runs every suite for real and is what seeds
      # the cache pull requests restore from. Vite+ cannot see env reads, so a
      # test that depends on one is the one thing a replay would miss.
      - name: Test
        run: vp run ${{ github.event_name == 'push' && '--no-cache' || '' }} ${{ matrix.shard.filters }} test

      # The core's suites again, on the driver a hosted Workspace's Durable
      # Object runs (ADR-0028), with node:sqlite playing the object's storage.
      # In the core shard because it reads what that shard's suites read, so
      # the two replay or run together.
      - name: Test the core on the durable driver
        if: matrix.shard.name == 'core'
        run: vp run ${{ github.event_name == 'push' && '--no-cache' || '' }} core#test:durable

      - name: Save the task cache
        uses: actions/cache/save@v6
        with:
          path: node_modules/.vite/task-cache
          key: vite-task-${{ runner.os }}-${{ runner.arch }}-${{ matrix.shard.name }}-${{ github.run_id }}-${{ github.run_attempt }}

  runtime:
    name: Workers and D1 migrations
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@v1.19.0
        with:
          node-version-file: .node-version
          cache: true
          run-install: false

      - name: Install
        run: vp install --frozen-lockfile

      # The docs site is the check job's, and nothing here reads it.
      - name: Build (Node server and SPA)
        run: vp run -F '!@deevy/docs' build

      - name: Build (Cloudflare Worker)
        run: vp run web#build:workers

      # The deployed shape, on workerd: bindings and asset routing included,
      # which no test of createApp can see. `--local` needs no account.
      - name: The Worker serves deevy
        run: vp run web#test:workers

      # Two hosted Workspaces in one Worker on workerd: provisioned through
      # Platform, signed in through the relay, isolated, swept by their alarms,
      # dumped, suspended and destroyed (docs/plans/hosted.md slice 9).
      - name: The hosted Worker serves its Workspaces
        run: vp run hosted#test:hosted

      # drizzle generates and wrangler applies (ADR-0008), so the projection is
      # only proven by wrangler applying it: an empty local D1, no account.
      - name: Migrations build the schema on D1
        run: vp run db#check:d1

      # A hosted Workspace's dump, converted by `import.mjs --for-d1`, applied
      # to an empty local D1: wrangler then has nothing to apply, or exactly
      # what the dump's release did not have (docs/OPERATIONS.md, "Taking a
      # hosted Workspace home").
      - name: A hosted Workspace's dump goes into D1
        run: vp run server#check:d1-import

      # deevy's own walk, on every deployment, with nothing outside this
      # machine: a label in a stubbed tracker becomes a Run, a Proposal, a
      # ruling, a branch, a pull request and a finish, with a scripted Agent
      # that holds only its key (docs/acceptance.md). The image, the Worker,
      # the image under a path, and a hosted Workspace, whose Worker the hosted
      # smoke above has just built.
      - name: An Agent works a record end to end, on every deployment
        run: vp run acceptance#walk

  # A gradual deploy runs the previous release on this one's schema, and so does
  # a rollback (ADR-0031). The migration guard in `check` refuses what would
  # break that; this runs it: the previous tag's server, built from the tag's
  # own tree and lockfile, on a database this tree migrated, and this tree again
  # on what that release wrote. Its own job because it is a second install and a
  # second build — about half a minute warm — that nothing else here needs.
  previous:
    name: The previous release on this schema
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # The previous release is the newest v* tag behind this commit, so
          # the history and the tags have to be here.
          fetch-depth: 0

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@v1.19.0
        with:
          node-version-file: .node-version
          cache: true
          run-install: false

      - name: Install
        run: vp install --frozen-lockfile

      - name: The previous release runs on this schema, and this one on what it wrote
        run: vp run server#test:previous

  # The image deevy ships, built, scanned and asked whether it runs. This arm is
  # well inside the tests' shadow, so the minutes are the only thing to save.
  #
  # No layer cache, and that is measured rather than assumed: `type=gha` with
  # `mode=max` took `Build deevy` from 40s to 208s, because the image runs
  # `vp install` and a whole workspace build, and exporting every layer of that
  # costs more than repeating it.
  images:
    name: The Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # A Node to run the image smoke with: the script imports node: builtins
      # only, so nothing is installed here.
      - name: Node
        uses: voidzero-dev/setup-vp@v1.19.0
        with:
          node-version-file: .node-version
          cache: true
          run-install: false

      # Single-architecture and native, so minutes rather than the emulated
      # build's tens of them — but bounded, because a hung docker build that
      # only trips the job timeout wastes twenty minutes saying nothing.
      - name: Build deevy
        timeout-minutes: 10
        run: docker build -f apps/server/Dockerfile -t deevy:ci .

      # Before the smoke, so a CRITICAL fails first.
      #
      # Three things it does not do, worth saying plainly. It reads OS packages
      # out of the distroless base's /var/lib/dpkg/status.d — about a dozen, and
      # that is the surface the base image choice is about. It does NOT see Node
      # itself, which is a bare binary at /nodejs and not a dpkg package, so a
      # Node CVE is answered by moving the pinned base digest and not by this.
      # And it finds no JavaScript at all: `vp pack` inlines every dependency
      # with no package.json beside it, so the JS supply chain is guarded by the
      # lockfile. `ignore-unfixed` because a CVE with no fix available reds an
      # unrelated pull request and teaches its author nothing.
      - name: Scan deevy for known vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: deevy:ci
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      # Everything this image is asked is asked by the script, so that the same
      # questions can be asked on a laptop — a Dockerfile change used to be
      # testable only by pushing. It brings its own container, volume and port.
      - name: The deevy image runs deevy
        run: node apps/server/scripts/smoke-image.ts
        env:
          DEEVY_IMAGE: deevy:ci
