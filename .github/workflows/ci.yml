name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Called by release.yml, so a tag cannot publish something that does not build.
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Four jobs that need nothing from each other, because wall-clock time is what
# anybody waits for. Run as one job these took six minutes, most of it one
# machine running six test suites against each other for its four cores; split,
# the slowest arm is the tests and everything else finishes under it. Each arm
# pays its own install, which is the trade: more runner minutes, half the wait.
jobs:
  check:
    name: Format, lint, typecheck, and the snapshots
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@v1.19.0
        with:
          node-version-file: .node-version
          cache: true
          run-install: false

      - name: Install
        run: vp install --frozen-lockfile

      - name: Format, lint, typecheck
        run: vp check

      - name: Build (Node server and SPA)
        run: vp run -r build

      - name: Build (Cloudflare Worker)
        run: vp run web#build:workers

      - name: Validate the Worker bundle
        run: vp run web#check:workers

      - name: Migration SQL guard
        run: vp run db#check:migrations

      - name: OpenAPI snapshot is current
        run: |
          vp run core#snapshot:openapi
          git diff --exit-code -- packages/core/openapi.json

      # The tool set an agent sees, diffed like the HTTP surface (ADR-0009).
      - name: MCP tool list is current
        run: |
          vp run core#snapshot:mcp-tools
          git diff --exit-code -- packages/core/mcp-tools.json

  # Sharded, because six suites on one four-core runner spent most of their time
  # waiting for each other. The groups are balanced on measured time — apps/web
  # is 73s on its own and sets the floor, so splitting further buys nothing
  # while the runtime arm sits at ~120s.
  test:
    name: Tests (${{ matrix.shard.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard:
          - name: web
            filters: -F web
          - name: core
            filters: -F core -F db -F adapters -F release
          - name: runtime and server
            filters: -F agent -F server
    steps:
      - uses: actions/checkout@v7

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@v1.19.0
        with:
          node-version-file: .node-version
          cache: true
          run-install: false

      - name: Install
        run: vp install --frozen-lockfile

      # Restored after the install, which can touch the directory. `test` is a
      # task in each package's vite.config rather than a package.json script,
      # which is what makes it cacheable at all; the fingerprint is the files
      # each suite reads, so a shard whose packages nobody touched skips
      # entirely and one that reads a changed packages/core does not.
      # https://viteplus.dev/guide/github-actions-cache
      - name: Restore the task cache
        uses: actions/cache/restore@v6
        with:
          path: node_modules/.vite/task-cache
          # Unique per run so every run saves, and per shard so three jobs
          # writing at once do not overwrite each other's.
          key: vite-task-${{ runner.os }}-${{ runner.arch }}-${{ matrix.shard.name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            vite-task-${{ runner.os }}-${{ runner.arch }}-${{ matrix.shard.name }}-

      # A pull request replays a suite whose inputs — every file it read, less
      # vitest's own results directory (each package's vite.config) — match a
      # cached run; a push to main runs every suite for real and is what seeds
      # the cache pull requests restore from. Vite+ cannot see env reads, so a
      # test that depends on one is the one thing a replay would miss.
      - name: Test
        run: vp run ${{ github.event_name == 'push' && '--no-cache' || '' }} ${{ matrix.shard.filters }} test

      - name: Save the task cache
        uses: actions/cache/save@v6
        with:
          path: node_modules/.vite/task-cache
          key: vite-task-${{ runner.os }}-${{ runner.arch }}-${{ matrix.shard.name }}-${{ github.run_id }}-${{ github.run_attempt }}

  runtime:
    name: Workers, D1 migrations, and the acceptance walk
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@v1.19.0
        with:
          node-version-file: .node-version
          cache: true
          run-install: false

      - name: Install
        run: vp install --frozen-lockfile

      - name: Build (Node server and SPA)
        run: vp run -r build

      - name: Build (Cloudflare Worker)
        run: vp run web#build:workers

      # The deployed shape, on workerd: bindings and asset routing included,
      # which no test of createApp can see. `--local` needs no account.
      - name: The Worker serves deevy
        run: vp run web#test:workers

      # drizzle generates and wrangler applies (ADR-0008), so the projection is
      # only proven by wrangler applying it: an empty local D1, no account.
      - name: Migrations build the schema on D1
        run: vp run db#check:d1

      # M4's acceptance walk, which needs no account and no OAuth App: deevy on
      # both deployments, a GitHub stub, a bare git repository and a stub of
      # GitHub's pull-request API, with the real supervisor driving
      # (docs/m4-acceptance.md).
      - name: The reference runtime works an Issue end to end, on both deployments
        run: vp run agent#acceptance

  # Both images in one job: the runtime smoke needs a deevy to talk to, and
  # building that image twice in two jobs is the same minute spent twice. This
  # arm is well inside the tests' shadow either way, so the minutes are the only
  # thing to save here.
  #
  # No layer cache, and that is measured rather than assumed: `type=gha` with
  # `mode=max` took `Build deevy` from 40s to 208s, because the image runs
  # `vp install` and a whole workspace build, and exporting every layer of that
  # costs more than repeating it.
  images:
    name: Docker images and the runtime smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # A Node to run the image smoke with: the script imports node: builtins
      # only, so nothing is installed here.
      - name: Node
        uses: voidzero-dev/setup-vp@v1.19.0
        with:
          node-version-file: .node-version
          cache: true
          run-install: false

      # Single-architecture and native, so minutes rather than the emulated
      # build's tens of them — but bounded, because a hung docker build that
      # only trips the job timeout wastes twenty minutes saying nothing.
      - name: Build deevy
        timeout-minutes: 10
        run: docker build -f apps/server/Dockerfile -t deevy:ci .

      # Here rather than at the end of the job, so a CRITICAL fails before ten
      # minutes of runtime builds nobody will look at.
      #
      # Three things it does not do, worth saying plainly. It reads OS packages
      # out of the distroless base's /var/lib/dpkg/status.d — about a dozen, and
      # that is the surface the base image choice is about. It does NOT see Node
      # itself, which is a bare binary at /nodejs and not a dpkg package, so a
      # Node CVE is answered by moving the pinned base digest and not by this.
      # And it finds no JavaScript at all: `vp pack` inlines every dependency
      # with no package.json beside it, so the JS supply chain is guarded by the
      # lockfile. `ignore-unfixed` because a CVE with no fix available reds an
      # unrelated pull request and teaches its author nothing.
      #
      # deevy:ci only. The runtime images are node:24-slim plus an npm-installed
      # harness, which is a much larger surface and a separate decision.
      - name: Scan deevy for known vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: deevy:ci
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      # Everything this image is asked is asked by the script, so that the same
      # questions can be asked on a laptop — a Dockerfile change used to be
      # testable only by pushing. It brings its own container, volume and port,
      # so it never collides with the long-lived deevy below.
      - name: The deevy image runs deevy
        run: node apps/server/scripts/smoke-image.ts
        env:
          DEEVY_IMAGE: deevy:ci

      # One image per harness (docs/harnesses.md). The build stage is shared
      # through the local layer cache, so the four differ by one npm or curl —
      # but four installs on every pull-request push is still four installs,
      # so a pull request builds the default image only and main, and the
      # release that calls this, build all four.
      - name: Which harnesses
        id: which
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "list=claude-code" >> "$GITHUB_OUTPUT"
          else
            echo "list=claude-code opencode cursor copilot" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the runtime, once per harness
        timeout-minutes: 20
        run: |
          for harness in ${{ steps.which.outputs.list }}; do
            docker build -f apps/agent/Dockerfile --build-arg HARNESS=$harness -t deevy-agent:ci-$harness .
          done

      # The long-lived one the runtime images talk to, which is a second job for
      # the same image and why the step above does not leave this behind.
      # Readiness is the image's own HEALTHCHECK rather than a curl from the
      # host, which makes this wait a test of the mechanism compose's
      # `depends_on: condition: service_healthy` uses for the agent service.
      - name: A deevy for the runtime images to talk to
        run: |
          docker network create deevy-ci
          docker run -d --name deevy --network deevy-ci -p 3000:3000 \
            -e BETTER_AUTH_SECRET=ci-secret-ci-secret-ci-secret-ci-secret \
            -e BETTER_AUTH_URL=http://localhost:3000 \
            -e DEEVY_DATABASE_PATH=/data/deevy.sqlite deevy:ci
          for i in $(seq 1 90); do
            status=$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{end}}' deevy)
            if [ "$status" = healthy ]; then exit 0; fi
            if [ "$status" = unhealthy ]; then break; fi
            sleep 1
          done
          docker logs deevy
          docker inspect -f '{{if .State.Health}}{{json .State.Health}}{{else}}no HEALTHCHECK{{end}}' deevy
          exit 1

      # A key nobody issued is refused, and the runtime says so and stops rather
      # than polling an instance it cannot be a Member of. BETTER_AUTH_URL stays
      # loopback above because Better Auth refuses a plain-http MCP resource
      # that is not; it is the OAuth issuer, and this authenticates with an API
      # key, so the two are independent here.
      # Each image first proves its harness binary runs ("harness <name>: <version>"
      # is logged before deevy is asked anything), then that a key nobody issued is
      # refused. Cursor and Copilot refuse earlier still, at the credential their
      # recipe requires, which is the same guard from the other side.
      - name: Each runtime image runs its harness and reports what deevy tells it
        run: |
          for harness in ${{ steps.which.outputs.list }}; do
            case $harness in cursor|copilot) continue ;; esac
            set +e
            out=$(docker run --rm --network deevy-ci \
              -e DEEVY_URL=http://deevy:3000 \
              -e DEEVY_AGENT_KEY=not-a-key deevy-agent:ci-$harness node dist/main.mjs --once 2>&1)
            code=$?
            set -e
            echo "$out"
            test $code -ne 0
            echo "$out" | grep -q "harness $harness:"
            echo "$out" | grep -qE "UNAUTHORIZED|FORBIDDEN"
          done
          for harness in ${{ steps.which.outputs.list }}; do
            case $harness in cursor|copilot) ;; *) continue ;; esac
            set +e
            out=$(docker run --rm --network deevy-ci \
              -e DEEVY_URL=http://deevy:3000 \
              -e DEEVY_AGENT_KEY=not-a-key deevy-agent:ci-$harness node dist/main.mjs --once 2>&1)
            code=$?
            set -e
            echo "$out"
            test $code -ne 0
            echo "$out" | grep -q "refuses to start without it"
          done

      # The claim the whole boundary rests on, made by a session rather than by
      # reading the code (docs/plans/agent-owns-git.md, convention 28). On one
      # user a shell in a session reads the supervisor's environment out of
      # /proc, and the Agent's key and the git token are in it.
      - name: A session cannot read the supervisor's environment
        run: |
          out=$(docker run --rm --cap-drop=ALL --cap-add=SETUID --cap-add=SETGID --cap-add=CHOWN --cap-add=DAC_OVERRIDE \
            -e DEEVY_AGENT_KEY=deevy_sk_ci_secret deevy-agent:ci-claude-code node -e '
              const { spawnSync } = require("child_process");
              const read = (opts) => spawnSync("sh", ["-c", "cat /proc/" + process.pid + "/environ"],
                { encoding: "utf8", ...opts });
              const saw = (r) => String(r.stdout).includes("deevy_sk_ci_secret");
              console.log("same-user:" + saw(read({})));
              console.log("session:" + saw(read({ uid: 10002, gid: 10002 })));
            ')
          echo "$out"
          # The first line is the control: without two users there is no bound,
          # so a run where neither can read it proves nothing.
          echo "$out" | grep -qx "same-user:true"
          echo "$out" | grep -qx "session:false"

      # And the other half: a session can actually work in what it was handed.
      # The capabilities below are the ones OPERATIONS.md tells an operator to
      # run with, so this step is what keeps that command true — the first
      # version of it was missing CHOWN, and every Run would have failed.
      - name: A session can work in the directory it was given
        run: |
          out=$(docker run --rm --cap-drop=ALL --cap-add=SETUID --cap-add=SETGID --cap-add=CHOWN --cap-add=DAC_OVERRIDE \
            deevy-agent:ci-claude-code node -e '
              const { mkdtempSync, chownSync, rmSync, writeFileSync } = require("fs");
              const { spawnSync } = require("child_process");
              const dir = mkdtempSync("/tmp/work-");
              chownSync(dir, 10002, 10002);
              const worked = spawnSync("sh", ["-c", "cd " + dir + " && git init -q . && echo x > f && git add -A && echo ok"],
                { uid: 10002, gid: 10002, encoding: "utf8" });
              if (worked.stdout.trim() !== "ok") throw new Error("the session could not work in it");
              writeFileSync(dir + "/from-supervisor", "y");
              const read = spawnSync("git", ["-c", "safe.directory=" + dir, "-C", dir, "status", "--porcelain"], { encoding: "utf8" });
              if (read.status !== 0) throw new Error("the supervisor could not read it back");
              rmSync(dir, { recursive: true, force: true });
              console.log("session-directory:ok");
            ')
          echo "$out"
          echo "$out" | grep -qx "session-directory:ok"

      - name: Configuration it cannot start without is named
        run: |
          set +e
          out=$(docker run --rm deevy-agent:ci-claude-code node dist/main.mjs --once 2>&1)
          code=$?
          set -e
          echo "$out"
          test $code -ne 0
          echo "$out" | grep -q DEEVY_URL
